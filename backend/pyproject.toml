[tool.poetry]
name = "lenny-growth-assistant-backend"
version = "1.0.0"
description = "Lenny Growth Assistant Backend API"

[tool.poetry.dependencies]
python = "^3.8"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
sqlalchemy = ">=2.0.0"
alembic = ">=1.13.0"
pydantic-settings = ">=2.0.0"
httpx = ">=0.27.0"
anthropic = ">=0.72.0"
aiofiles = ">=24.0.0"
numpy = ">=1.24.0"
python-dotenv = ">=1.0.0"
aiohttp = ">=3.10.0"

[tool.poetry.dev-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
